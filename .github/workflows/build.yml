name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 单元测试 + Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Build debug + run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :plugin-api:testDebugUnitTest :plugin:testDebugUnitTest :plugin:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: carwithme-debug
          path: plugin/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: 签名 Release APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      # 密钥从仓库 Secrets 读取：PLUGIN_KEYSTORE_BASE64（keystore 文件的 base64）。
      # 未配置时下面的 assembleRelease 会回退到 debug 签名（构建脚本会打警告），
      # 这样的产物只能本地验证，不要对外分发。
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PLUGIN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          else
            echo "::warning::未配置 PLUGIN_KEYSTORE_BASE64，本次 release 将回退到 debug 签名。"
          fi

      - name: Assemble release
        env:
          PLUGIN_STORE_FILE: ${{ github.workspace }}/keystore/release.jks
          PLUGIN_STORE_PASSWORD: ${{ secrets.PLUGIN_STORE_PASSWORD }}
          PLUGIN_KEY_ALIAS: ${{ secrets.PLUGIN_KEY_ALIAS }}
          PLUGIN_KEY_PASSWORD: ${{ secrets.PLUGIN_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :plugin:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp plugin/build/outputs/apk/release/*.apk "dist/carwithme-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body: |
            本插件以 **GPL-3.0-only** 发布。按 GPL-3.0 第 6 条，分发二进制时必须同时提供对应完整源码：

            - 源码仓库：${{ github.server_url }}/${{ github.repository }}
            - 对应版本：标签 `${{ github.ref_name }}`（检出该标签即可得到与本 APK 一一对应的源码）
            - 许可证全文随 APK 打包在 `assets/GPL-3.0.txt`，应用信息页内亦可查看

            契约模块 `plugin-api/` 为自有版权，不随 GPL 授权（见仓库内 `LICENSING.md`）。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
